# Inexpensive checks of the certifier's producer tools, exact mirrors and file-based guards (V2-PUBLIC #4).
#
# Manual trigger only (Actions tab, "Run workflow"): this repository receives automated status commits about
# every 20 minutes, and enabling push or pull_request triggers is an owner decision about CI minutes.
# Every job runs one command that also runs locally: `python3 -I scripts/ci_checks.py --group <job>`
# (`--list` names the checks).
#
# Measured on the development machine (AMD Ryzen 7 7700, 1 November 2026; GitHub's runners are slower per
# core, so expect 1.5-2.5 times these numbers):
#   mirror         10 checks, 83 s, plus about 30 s to install the pinned wheels
#   lint           lint_sources.sh without its ABI step 113 s (4100+ Lean files), pin check 1 s
#   lean-fixtures  (opt-in) the 32 forced-toy modules and Fiber3XLang with their KAM closure: 445 modules,
#                  1235 CPU-s serial, 177 s critical path, simulated 5-7 min on 4 cores, at most 2.5 GB per
#                  Lean process; plus the Mathlib dependency checkout and `lake exe cache get` (about 6.7 GB
#                  unpacked); then forced_xlang 25 s. A restored .lake/build cache skips unchanged modules.
name: certifier-ci

on:
  workflow_dispatch:
    inputs:
      lean-fixtures:
        description: "Also build the light Lean fixtures (Tests/Forced, Fiber3XLang) and run forced_xlang"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: certifier-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mirror:
    name: "mirrors and producers (Python, no Lean)"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Pinned producer environment (scripts/requirements.txt)
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: \
            -r scripts/requirements.txt
      - name: Mirror, regeneration and diagnostics checks
        run: python -I scripts/ci_checks.py --group mirror

  lint:
    name: "file-based guards"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: lint_sources.sh (ABI-hash step stubbed) and the pin check
        run: python -I scripts/ci_checks.py --group lint

  lean-fixtures:
    name: "light Lean fixtures (opt-in)"
    if: ${{ inputs.lean-fixtures }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Pinned producer environment (scripts/requirements.txt)
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: \
            -r scripts/requirements.txt
      - name: Install elan (the toolchain itself comes from lean-toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore the KAM build (Lake re-checks every trace; a stale restore is safe)
        uses: actions/cache@v4
        with:
          path: .lake/build
          key: kam-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('KAM/**/*.lean') }}
          restore-keys: |
            kam-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Mathlib build cache
        run: lake exe cache get
      - name: Build the light fixtures
        run: |
          targets=$(find KAM/CertificateSharp/V2/Tests/Forced -name '*.lean' | sort | sed 's#/#.#g; s#\.lean$##')
          lake build $targets KAM.CertificateSharp.V2.Tests.Fiber3XLang
      - name: Compiled-Lean cross-language checks (forced_xlang)
        run: python -I scripts/ci_checks.py --group lean
